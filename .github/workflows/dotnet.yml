# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches:
      - develop

jobs:
  build-test-package:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore
      run: dotnet restore Amortization-master/Amortization-master.sln

    - name: Build solution
      run: dotnet build Amortization-master/Amortization-master.sln --no-restore

    - name: Install Playwright Browsers
      run: pwsh Amortization-master/PlaywrightTests/bin/Debug/net9.0/playwright.ps1 install

    - name: Test
      run: dotnet test Amortization-master/Amortization-master.sln --no-build --verbosity normal